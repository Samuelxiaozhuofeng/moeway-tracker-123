<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1020" />
    <title>浸录离线中</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d1020;
        color: #f6f2e8;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: #b7b0a3;
        line-height: 1.7;
      }

      button {
        border: 0;
        border-radius: 14px;
        background: #f3b85b;
        color: #191205;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>网络恢复后刷新页面，浸录会继续同步本地记录。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
